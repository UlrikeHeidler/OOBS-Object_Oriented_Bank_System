name: Build and Scan Workflow (Detect)

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up dependencies if needed (optional)
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libidn11-dev

      # Build step (your instructions)
      - name: Build and Run App
        run: |
          cd build
          chmod +x run.sh
          ./run.sh
          
      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: main.exe
          retention-days: 1
  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout Source
      uses: actions/checkout@v5
    - name: Black Duck SCA Scan
      id: black-duck-sca-scan
      uses: blackduck-inc/black-duck-security-scan@v2
      
      ## DETECT Environment Variables
      env:
        DETECT_PROJECT_NAME: UHE-${{ github.event.repository.name }}
        DETECT_PROJECT_VERSION_NAME: ${{ github.event_name != 'pull_request' && github.ref_name || github.event.pull_request.base.ref }}-build

      with:
        ### SCANNING: Required fields
        blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
        blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
        
        ### SCANNING: Optional fields
        # blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL'

        ### PULL REQUEST COMMENTS
        blackducksca_prcomment_enabled: true
        
        ### FIX PULL REQUEST CREATION
        blackducksca_fixpr_enabled: true
        
        ### GitHub ISSUES CREATION
        blackducksca_externalIssues_create: true

        # Required when PR comments, Fix PR, Sarif Upload or GitHub Issues creation is enabled
        github_token: ${{ secrets.GITHUB_TOKEN }}

        ### SARIF report generation
        blackducksca_reports_sarif_create: true
        blackducksca_upload_sarif_report: true

        ## OPTIONAL DIAGNOSTICS: Upload logs as build artifact if true
        include_diagnostics: false
